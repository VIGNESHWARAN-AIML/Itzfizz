<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%" fill="none" class="supercar-svg">
  <defs>
    <!-- Car Body Metallic Gradient -->
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="40%">
      <stop offset="0%" stop-color="#181b22" />
      <stop offset="25%" stop-color="#2d323f" />
      <stop offset="55%" stop-color="#1a1d24" />
      <stop offset="85%" stop-color="#ff4d00" />
      <stop offset="100%" stop-color="#cc3700" />
    </linearGradient>

    <!-- Roof & Glass Gradient -->
    <linearGradient id="glassGradient" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#05070a" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#141c26" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#020305" stop-opacity="0.98" />
    </linearGradient>

    <!-- Chrome & Rim Gradient -->
    <linearGradient id="rimMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#8a93a0" />
      <stop offset="70%" stop-color="#23272f" />
      <stop offset="100%" stop-color="#606773" />
    </linearGradient>

    <!-- Caliper Accent -->
    <linearGradient id="caliperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b22" />
      <stop offset="100%" stop-color="#c43500" />
    </linearGradient>

    <!-- Headlight Beam Glow -->
    <linearGradient id="headlightBeam" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <!-- Underglow -->
    <radialGradient id="underglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff4d00" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#ff4d00" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ff4d00" stop-opacity="0" />
    </radialGradient>

    <!-- Tire Rubber Gradient -->
    <radialGradient id="tireGrad" cx="50%" cy="50%" r="50%">
      <stop offset="68%" stop-color="#121316" />
      <stop offset="85%" stop-color="#23262c" />
      <stop offset="95%" stop-color="#0d0e10" />
      <stop offset="100%" stop-color="#050506" />
    </radialGradient>

    <!-- Blur filter for glow -->
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dynamic Underglow Shadow & Floor Glow -->
  <ellipse cx="450" cy="285" rx="380" ry="24" fill="url(#underglow)" />
  <ellipse cx="440" cy="288" rx="360" ry="14" fill="#000000" opacity="0.8" />

  <!-- Headlight Projection Beam (Casts forward rightwards) -->
  <polygon points="760,195 900,165 900,285 750,225" fill="url(#headlightBeam)" opacity="0.65" />

  <!-- CAR BODY MAIN GROUP -->
  <g id="car-chassis">
    <!-- Rear Underbody / Diffuser fins -->
    <path d="M 120 255 L 105 272 L 155 272 L 175 255 Z" fill="#0a0b0e" />
    <path d="M 140 258 L 130 272 L 145 272 Z" fill="#ff4d00" opacity="0.8" />

    <!-- Main Silhouette (Aggressive Low-Slung Hypercar) -->
    <path d="M 95 240 
             C 90 230, 95 210, 115 200 
             C 145 185, 205 175, 280 165 
             C 335 140, 395 105, 475 95 
             C 555 85, 620 95, 665 130 
             C 715 150, 770 180, 810 195 
             C 830 202, 840 215, 835 225 
             C 830 235, 815 242, 790 248 
             C 775 240, 755 200, 690 200 
             C 630 200, 610 240, 595 255 
             L 335 255 
             C 320 240, 300 200, 235 200 
             C 170 200, 150 240, 135 255 
             L 105 252 
             C 98 250, 95 245, 95 240 Z" 
          fill="url(#bodyGradient)" />

    <!-- Aerodynamic Side Sculpting / Door Indent -->
    <path d="M 330 242 
             C 350 215, 385 195, 440 190 
             C 510 185, 560 210, 590 240 
             C 570 238, 520 225, 450 228 
             C 390 230, 350 240, 330 242 Z" 
          fill="#0c0e12" opacity="0.65" />

    <!-- Carbon Fiber Side Skirt & Ground Effect Lip -->
    <path d="M 125 257 L 142 257 C 158 245, 178 220, 235 220 C 290 220, 310 245, 328 257 L 600 257 C 618 245, 638 220, 695 220 C 750 220, 770 245, 788 257 L 825 257 L 815 264 L 115 264 Z" fill="#08090c" />
    <line x1="330" y1="260" x2="600" y2="260" stroke="#ff4d00" stroke-width="2.5" />

    <!-- Greenhouse / Cockpit Canopy Glass -->
    <path d="M 365 155 
             C 415 125, 465 105, 520 102 
             C 580 100, 625 115, 650 145 
             C 658 155, 645 162, 630 162 
             C 580 162, 530 160, 480 160 
             C 430 160, 390 162, 365 165 Z" 
          fill="url(#glassGradient)" stroke="#2b313d" stroke-width="1.5" />

    <!-- A-Pillar and B-Pillar Structural Accents -->
    <path d="M 525 102 L 532 159" stroke="#1d222b" stroke-width="3" />
    <path d="M 620 115 L 638 152" stroke="#2a303c" stroke-width="2" />

    <!-- Reflection highlight on windshield -->
    <path d="M 545 108 L 625 128 L 605 142 L 535 125 Z" fill="#ffffff" opacity="0.12" />

    <!-- Side Mirror -->
    <path d="M 535 152 C 545 145, 560 145, 565 150 C 568 154, 555 158, 540 157 Z" fill="#ff4d00" />
    <path d="M 530 155 L 538 156" stroke="#000000" stroke-width="2" />

    <!-- Character Highlight Lines -->
    <path d="M 270 170 C 350 160, 480 165, 630 178" stroke="#ffffff" stroke-width="1" opacity="0.3" fill="none" />
    <path d="M 680 155 C 730 175, 780 195, 825 208" stroke="#ff8533" stroke-width="1.5" opacity="0.6" fill="none" />

    <!-- Rear Active Aero Wing / Spoiler -->
    <path d="M 95 195 C 105 192, 130 188, 155 188 L 165 195 L 105 202 Z" fill="#ff4d00" />
    <path d="M 115 202 L 110 220" stroke="#0e1014" stroke-width="3" />
    <path d="M 140 195 L 138 215" stroke="#0e1014" stroke-width="3" />

    <!-- Rear LED Taillight Bar (Neon Amber/Red Horizon) -->
    <path d="M 96 222 L 110 220 C 130 218, 160 216, 180 216" stroke="#ff1e00" stroke-width="4" filter="url(#laserGlow)" stroke-linecap="round" />
    <path d="M 98 222 L 140 219" stroke="#ffffff" stroke-width="1.5" opacity="0.8" />

    <!-- Front Laser Headlight Cluster -->
    <polygon points="775,205 825,212 815,220 770,215" fill="#e0f2fe" filter="url(#laserGlow)" />
    <line x1="772" y1="210" x2="822" y2="216" stroke="#38bdf8" stroke-width="3" />
    <line x1="785" y1="213" x2="820" y2="218" stroke="#ffffff" stroke-width="1.5" />
    
    <!-- Front Air Intake Mesh & Splitter Winglet -->
    <polygon points="790,230 830,227 828,245 785,242" fill="#090a0d" />
    <path d="M 825 235 L 838 245 L 820 252 Z" fill="#ff4d00" />
  </g>

  <!-- WHEEL 1: REAR WHEEL (Center at X: 235, Y: 255, Radius: 48) -->
  <g id="wheel-rear" class="wheel-group" transform-origin="235 255">
    <!-- Tire Rubber Base -->
    <circle cx="235" cy="255" r="48" fill="url(#tireGrad)" stroke="#1a1c22" stroke-width="2" />
    <!-- Tread Edge Detail -->
    <circle cx="235" cy="255" r="45" stroke="#08090b" stroke-width="1.5" stroke-dasharray="4,2" fill="none" opacity="0.5" />
    
    <!-- Brake Rotor Disc -->
    <circle cx="235" cy="255" r="32" fill="#303540" stroke="#4b5563" stroke-width="1" />
    <!-- Rotor Vents -->
    <circle cx="235" cy="255" r="28" stroke="#1f232b" stroke-width="1.5" stroke-dasharray="2,3" fill="none" />
    <!-- Performance Brake Caliper -->
    <path d="M 215 235 C 222 228, 235 228, 245 233 L 241 245 C 235 242, 226 242, 220 245 Z" fill="url(#caliperGrad)" />
    
    <!-- Outer Alloy Rim Lip -->
    <circle cx="235" cy="255" r="30" fill="none" stroke="url(#rimMetal)" stroke-width="3" />

    <!-- Rotating Rim Spokes Group -->
    <g class="rotating-spokes" transform-origin="235 255">
      <circle cx="235" cy="255" r="8" fill="#111317" stroke="#8a93a0" stroke-width="1.5" />
      <!-- Multi-Spoke Turbine Blades -->
      <line x1="235" y1="255" x2="235" y2="226" stroke="url(#rimMetal)" stroke-width="3.5" stroke-linecap="round" />
      <line x1="235" y1="255" x2="263" y2="246" stroke="url(#rimMetal)" stroke-width="3.5" stroke-linecap="round" />
      <line x1="235" y1="255" x2="252" y2="280" stroke="url(#rimMetal)" stroke-width="3.5" stroke-linecap="round" />
      <line x1="235" y1="255" x2="218" y2="280" stroke="url(#rimMetal)" stroke-width="3.5" stroke-linecap="round" />
      <line x1="235" y1="255" x2="207" y2="246" stroke="url(#rimMetal)" stroke-width="3.5" stroke-linecap="round" />

      <!-- Secondary aerodynamic spoke sub-fins -->
      <line x1="235" y1="255" x2="250" y2="232" stroke="#ff4d00" stroke-width="1.5" />
      <line x1="235" y1="255" x2="263" y2="265" stroke="#ff4d00" stroke-width="1.5" />
      <line x1="235" y1="255" x2="235" y2="284" stroke="#ff4d00" stroke-width="1.5" />
      <line x1="235" y1="255" x2="207" y2="265" stroke="#ff4d00" stroke-width="1.5" />
      <line x1="235" y1="255" x2="220" y2="232" stroke="#ff4d00" stroke-width="1.5" />

      <!-- Center Lock Nut with ItzFizz Orange Core -->
      <circle cx="235" cy="255" r="4.5" fill="#ff4d00" />
      <circle cx="235" cy="255" r="2" fill="#ffffff" />
    </g>
  </g>

  <!-- WHEEL 2: FRONT WHEEL (Center at X: 695, Y: 255, Radius: 48) -->
  <g id="wheel-front" class="wheel-group" transform-origin="695 255">
    <!-- Tire Rubber Base -->
    <circle cx="695" cy="255" r="48" fill="url(#tireGrad)" stroke="#1a1c22" stroke-width="2" />
    <!-- Tread Edge Detail -->
    <circle cx="695" cy="255" r="45" stroke="#08090b" stroke-width="1.5" stroke-dasharray="4,2" fill="none" opacity="0.5" />
    
    <!-- Brake Rotor Disc -->
    <circle cx="695" cy="255" r="32" fill="#303540" stroke="#4b5563" stroke-width="1" />
    <!-- Rotor Vents -->
    <circle cx="695" cy="255" r="28" stroke="#1f232b" stroke-width="1.5" stroke-dasharray="2,3" fill="none" />
    <!-- Performance Brake Caliper -->
    <path d="M 675 235 C 682 228, 695 228, 705 233 L 701 245 C 695 242, 686 242, 680 245 Z" fill="url(#caliperGrad)" />

    <!-- Outer Alloy Rim Lip -->
    <circle cx="695" cy="255" r="30" fill="none" stroke="url(#rimMetal)" stroke-width="3" />

    <!-- Rotating Rim Spokes Group -->
    <g class="rotating-spokes" transform-origin="695 255">
      <circle cx="695" cy="255" r="8" fill="#111317" stroke="#8a93a0" stroke-width="1.5" />
      <!-- Multi-Spoke Turbine Blades -->
      <line x1="695" y1="255" x2="695" y2="226" stroke="url(#rimMetal)" stroke-width="3.5" stroke-linecap="round" />
      <line x1="695" y1="255" x2="723" y2="246" stroke="url(#rimMetal)" stroke-width="3.5" stroke-linecap="round" />
      <line x1="695" y1="255" x2="712" y2="280" stroke="url(#rimMetal)" stroke-width="3.5" stroke-linecap="round" />
      <line x1="695" y1="255" x2="678" y2="280" stroke="url(#rimMetal)" stroke-width="3.5" stroke-linecap="round" />
      <line x1="695" y1="255" x2="667" y2="246" stroke="url(#rimMetal)" stroke-width="3.5" stroke-linecap="round" />

      <!-- Secondary aerodynamic spoke sub-fins -->
      <line x1="695" y1="255" x2="710" y2="232" stroke="#ff4d00" stroke-width="1.5" />
      <line x1="695" y1="255" x2="723" y2="265" stroke="#ff4d00" stroke-width="1.5" />
      <line x1="695" y1="255" x2="695" y2="284" stroke="#ff4d00" stroke-width="1.5" />
      <line x1="695" y1="255" x2="667" y2="265" stroke="#ff4d00" stroke-width="1.5" />
      <line x1="695" y1="255" x2="680" y2="232" stroke="#ff4d00" stroke-width="1.5" />

      <!-- Center Lock Nut with ItzFizz Orange Core -->
      <circle cx="695" cy="255" r="4.5" fill="#ff4d00" />
      <circle cx="695" cy="255" r="2" fill="#ffffff" />
    </g>
  </g>
</svg>
